[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["frontend", ".venv", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/app/calculations/biocarbon_estimator.py" = ["E501"]  # constants table, left byte-identical
"backend/app/calculations/corsia.py" = ["E501"]  # regulatory constants file, left byte-identical
"backend/app/routers/*" = ["B008"]  # FastAPI Depends()/Query() defaults

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
